name: BabyLog supply chain

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '20261126_wpc/**'
      - '.github/workflows/babylog-supply-chain.yml'
  push:
    paths:
      - '20261126_wpc/**'
      - '.github/workflows/babylog-supply-chain.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: 20261126_wpc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: 20261126_wpc/global.json
      - name: Test, build, SBOM and vulnerability gate
        run: ./rehearse.ps1 -Version $env:GITHUB_SHA -SkipMonitoring
      - name: Compare package inventories
        if: ${{ !cancelled() && hashFiles('20261126_wpc/.artifacts/sbom/manifest.json') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" > .artifacts/sbom/github.spdx.json
          python3 scripts/compare-sbom.py
      - name: Retain SBOM and scanner evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: babylog-supply-chain
          include-hidden-files: true
          path: |
            20261126_wpc/.artifacts/sbom/
            20261126_wpc/.artifacts/security/
            20261126_wpc/.artifacts/vulnerability/
            20261126_wpc/.artifacts/containers/images.json
            20261126_wpc/.artifacts/containers/publish-sha256.json
            20261126_wpc/.artifacts/containers/build.log
            20261126_wpc/.artifacts/containers/smoke-*/*-result.json
