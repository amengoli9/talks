name: babylog
services:
  babylog:
    image: babylog:standard
    platform: linux/amd64
    build:
      context: .
      dockerfile: containers/Dockerfile
      target: standard
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BabyLog: Data Source=/data/babylog.db
      DataProtection__Path: /data/keys
      BabyLog__BaseUrl: http://127.0.0.1:8080
      TZ: Europe/Rome
    user: "1654:1654"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    volumes:
      - babylog-data:/data
    restart: unless-stopped
volumes:
  babylog-data:
